<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Atributos e Tags</title>
    </head>
    <body>
        <!--assim eu escrevo um comentário-->
        <!-- Atributos servem principalmente para personalizar e adicionar funcionalidades a uma tag Html-->
        <!--Existem diversos atributos para tags e muitas tags tem seus proprios atributos -->
        <!-- Alguns atributos em comuns entre as tags html-->
        
        <!--
        class="_" Atribui uma classe ao elemento (uma classe pode ser atribuida para um ou mais elementos);
        id="_" Atribui um id ao elemento (um id deve ser unico, ou seja atribuido a um unico elemento);
        style="_" Permite incluir elementos css (estilos) diretamente na tag;
        lang="_" Atribui o idioma do elemento;
        title="_" Atribui um titulo ao elemento (o titulo aparece quando o mouse passa por cima do elemento);
        alt="_" Atribui um texto alternativo a uma imagem (o texto aparece quando a imagem não é carregada);
        hidden="_" Oculta o elemento da tela (o elemento não é exibido na tela);
        align="_" Alinha o elemento (esquerda, direita, centro);
        width="_" Atribui uma largura ao elemento;
        height="_" Atribui uma altura ao elemento;
        -->
        <!--alguns exemplos abaixo-->
        <div class="container" id="div1" style="display: flex; background-color: blue;">
        </div>
        <div class="container" id="div2" >
        </div>
        <!-- nestes dois exemplos de div eu declarei classes e ids-->
         <!--na div1 o estilo foi aplicado diretamente na tag, enquanto na div2 o estilo foi aplicado através do arquivo style.css-->


    </body>
</html>
